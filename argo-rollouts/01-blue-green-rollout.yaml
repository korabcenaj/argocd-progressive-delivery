apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-processor
  namespace: prod
  labels:
    app: payment-processor
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: payment-processor
  strategy:
    blueGreen:
      # Active service routes production traffic to the stable version
      activeService: payment-processor-active
      # Preview service routes test/smoke traffic to the newly deployed candidate
      previewService: payment-processor-preview
      # Manual intervention or automated analysis gate before traffic switch
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      # Analysis run against preview pods before cutover
      prePromotionAnalysis:
        templates:
          - templateName: success-rate-gate
          - templateName: latency-p95-gate
        args:
          - name: service-name
            value: payment-processor-preview
      # Verification analysis while active pods ramp down
      scaleDownDelaySeconds: 60
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
        - name: payment-processor
          image: internal-registry.enterprise.internal/apps/payment-processor:v2.1.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
