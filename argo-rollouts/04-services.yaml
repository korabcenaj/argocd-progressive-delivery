apiVersion: v1
kind: Service
metadata:
  name: payment-processor-active
  namespace: prod
  labels:
    app: payment-processor
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: payment-processor
---
apiVersion: v1
kind: Service
metadata:
  name: payment-processor-preview
  namespace: prod
  labels:
    app: payment-processor
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: payment-processor
---
apiVersion: v1
kind: Service
metadata:
  name: order-gateway
  namespace: prod
  labels:
    app: order-gateway
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    app: order-gateway
